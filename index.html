<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Program</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        p {
            color: #4b5563;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 6px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            background-color: #f9fafb;
            transition: border-color 0.2s ease;
        }
        .upload-area:hover {
            border-color: #9ca3af;
        }
        .file-input {
            display: block;
            width: 100%;
            margin: 0 auto;
            color: #4b5563;
            font-size: 0.875rem;
        }
        .file-input::file-selector-button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            margin-right: 1rem;
            transition: background-color 0.2s ease;
        }
        .file-input::file-selector-button:hover {
            background-color: #2563eb;
        }
        button[type="submit"] {
            background-color: #111827;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            font-size: 1rem;
        }
        button[type="submit"]:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Program</h1>
        <p>Please upload your sample_program.txt file.</p>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="upload-area">
                <input type="file" name="file" id="file" accept=".txt" class="file-input" required>
            </div>
            <button type="submit">Upload File</button>
        </form>
    </div>
</body>
</html>
