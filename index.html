<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }
        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #4b5563;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 6px;
            padding: 2rem;
            margin-bottom: 1rem;
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }
        .upload-area:hover {
            border-color: #9ca3af;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-block;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #10b981;
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .submit-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Program</h1>
        <p>Please select your <strong>sample_program.txt</strong> file to upload.</p>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-area">
                <div class="file-input-wrapper">
                    <button type="button" class="btn">Choose File</button>
                    <input type="file" name="file" accept=".txt" required />
                </div>
            </div>
            <button type="submit" class="btn submit-btn">Upload File</button>
        </form>
    </div>
</body>
</html>
