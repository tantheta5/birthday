<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Sample Program</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: #ffffff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #111;
      }
      p {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .file-upload {
        display: inline-block;
        padding: 0.5rem 1rem;
        cursor: pointer;
        background-color: #007bff;
        color: #fff;
        border-radius: 4px;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      .file-upload:hover {
        background-color: #0056b3;
      }
      input[type="file"] {
        display: none;
      }
      .submit-btn {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
      }
      .submit-btn:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Program</h1>
      <p>Please select your <strong>sample_program.txt</strong> file to upload.</p>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <label class="file-upload">
          Choose File
          <input type="file" name="file" accept=".txt" required>
        </label>
        <br>
        <button type="submit" class="submit-btn">Upload</button>
      </form>
    </div>
  </body>
</html>
