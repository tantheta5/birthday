<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal App</title>
  <style>
    :root {
      --bg-color: #f9fafb;
      --text-color: #111827;
      --card-bg: #ffffff;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-width: 28rem;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .upload-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input {
      font-size: 0.875rem;
      color: #6b7280;
    }

    .file-input::file-selector-button {
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
      background-color: #f3f4f6;
      color: var(--text-color);
      cursor: pointer;
      font-weight: 500;
      margin-right: 1rem;
      transition: background-color 0.2s;
    }

    .file-input::file-selector-button:hover {
      background-color: #e5e7eb;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.625rem 1.25rem;
      border: none;
      border-radius: 0.375rem;
      background-color: var(--primary);
      color: white;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>File Uploader</h1>
    <p>Please upload your sample_program.txt file.</p>

    <form class="upload-container" action="#" method="post" enctype="multipart/form-data">
      <div class="file-input-wrapper">
        <input type="file" id="file" name="file" accept=".txt" class="file-input" required>
      </div>
      <button type="submit" class="btn">Upload File</button>
    </form>
  </div>
</body>
</html>
