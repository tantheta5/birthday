<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal File Upload</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    p {
      margin-bottom: 1.5rem;
      color: #666;
      font-size: 0.95rem;
    }
    .file-input-wrapper {
      position: relative;
      display: inline-block;
      overflow: hidden;
      cursor: pointer;
    }
    .file-input-wrapper input[type="file"] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .file-input-wrapper:hover .btn {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload File</h1>
    <p>Please select a <code>sample_program.txt</code> file to upload.</p>
    <div class="file-input-wrapper">
      <button class="btn">Choose File</button>
      <input type="file" accept=".txt">
    </div>
  </div>
</body>
</html>
