<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Upload</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #222;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .btn {
      border: 2px solid #007bff;
      color: #fff;
      background-color: #007bff;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }
    .btn:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }
    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Project Upload</h1>
    <p>Please upload your <code>sample_program.txt</code> file.</p>

    <div class="upload-btn-wrapper">
      <button class="btn">Upload File</button>
      <input type="file" name="file" accept=".txt" />
    </div>
  </div>

</body>
</html>
