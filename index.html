<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Program</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f7f9fc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #1a1a1a;
      }
      .card {
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        text-align: center;
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4a5568;
        font-size: 0.95rem;
      }
      .file-input-container {
        margin-bottom: 1.5rem;
      }
      input[type="file"] {
        display: block;
        width: 100%;
        font-size: 0.9rem;
        color: #4a5568;
        padding: 0.5rem;
        background: #f7f9fc;
        border: 1px dashed #cbd5e0;
        border-radius: 6px;
        cursor: pointer;
        box-sizing: border-box;
      }
      input[type="file"]::file-selector-button {
        margin-right: 1rem;
        padding: 0.5rem 1rem;
        border: none;
        background: #4299e1;
        color: white;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s ease;
      }
      input[type="file"]::file-selector-button:hover {
        background: #3182ce;
      }
      .submit-btn {
        background: #48bb78;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        transition: background 0.2s ease;
        box-sizing: border-box;
      }
      .submit-btn:hover {
        background: #38a169;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Upload Program</h1>
      <p>Select a .txt file to upload (e.g., sample_program.txt)</p>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="file-input-container">
          <input type="file" name="programFile" accept=".txt" required />
        </div>
        <button type="submit" class="submit-btn">Upload</button>
      </form>
    </div>
  </body>
</html>
