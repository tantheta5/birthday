<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Program</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .custom-file-upload {
        border: 2px dashed #ccc;
        display: block;
        padding: 2rem 1rem;
        cursor: pointer;
        border-radius: 4px;
        background-color: #fafafa;
        transition: border-color 0.2s;
      }
      .custom-file-upload:hover {
        border-color: #007bff;
      }
      .btn {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
        display: inline-block;
        margin-top: 1rem;
      }
      .btn:hover {
        background-color: #0056b3;
      }
      /* Hide the default input entirely */
      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Program</h1>
      <p>Please upload your <code>sample_program.txt</code> file below.</p>

      <!-- When we use display:none on input, clicking label still works in HTML -->
      <label class="custom-file-upload">
        <div>Drop file here or click to browse</div>
        <input type="file" accept=".txt" />
        <span class="btn">Choose File</span>
      </label>
    </div>
  </body>
</html>
