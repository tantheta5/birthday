<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Program</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 1rem;
      }
      p {
        color: #6b7280;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
      }
      .file-upload {
        margin-bottom: 1rem;
      }
      input[type="file"] {
        display: block;
        width: 100%;
        font-size: 0.875rem;
        color: #6b7280;
        file-selector-button: {
          background-color: #e5e7eb;
          border: 0;
          padding: 0.5rem 1rem;
          border-radius: 0.25rem;
          color: #374151;
          font-weight: 500;
          cursor: pointer;
          transition: background-color 0.2s;
        }
        file-selector-button:hover {
          background-color: #d1d5db;
        }
      }
      /* Fallback for file selector pseudo element if needed */
      input[type="file"]::file-selector-button {
        background-color: #f3f4f6;
        border: 1px solid #d1d5db;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        color: #374151;
        font-weight: 500;
        cursor: pointer;
        margin-right: 1rem;
        transition: background-color 0.2s;
      }
      input[type="file"]::file-selector-button:hover {
        background-color: #e5e7eb;
      }
      .submit-btn {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
        width: 100%;
      }
      .submit-btn:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Upload Program</h1>
      <p>Select your sample_program.txt file to upload.</p>
      <form action="#" method="post" enctype="multipart/form-data">
        <div class="file-upload">
          <input type="file" name="sample_program" accept=".txt" required />
        </div>
        <button type="submit" class="submit-btn">Upload File</button>
      </form>
    </div>
  </body>
</html>
