<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Program</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #2c3e50;
    }
    p {
      color: #666;
      margin-bottom: 1.5rem;
    }
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .btn {
      border: 2px solid #3498db;
      color: #3498db;
      background-color: white;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background-color: #3498db;
      color: white;
    }
    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
    }
    .submit-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    .submit-btn:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload Program</h1>
    <p>Please select your <strong>sample_program.txt</strong> file to upload.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <div class="upload-btn-wrapper">
        <button type="button" class="btn">Choose File</button>
        <input type="file" name="file" accept=".txt" required />
      </div>
      <br>
      <button type="submit" class="submit-btn">Upload</button>
    </form>
  </div>
</body>
</html>
