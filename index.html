<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Sample Program</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .upload-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #2c3e50;
    }
    p {
      color: #666;
      margin-bottom: 1.5rem;
    }
    .file-input-wrapper {
      margin-bottom: 1.5rem;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #fafafa;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <h1>Upload Program</h1>
    <p>Please select a sample_program.txt file to upload.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <div class="file-input-wrapper">
        <input type="file" name="programFile" id="programFile" accept=".txt" required>
      </div>
      <button type="submit">Upload File</button>
    </form>
  </div>
</body>
</html>
