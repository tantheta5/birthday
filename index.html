<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Program</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background-color: white;
        padding: 2.5rem;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        color: #1f2937;
      }
      .upload-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .file-input-wrapper input[type="file"] {
        font-size: 100px;
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
      }
      .file-input-button {
        display: block;
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: #f3f4f6;
        border: 1px dashed #d1d5db;
        border-radius: 0.5rem;
        color: #4b5563;
        font-size: 0.875rem;
        transition: all 0.2s;
        box-sizing: border-box;
      }
      .file-input-wrapper:hover .file-input-button {
        background-color: #e5e7eb;
        border-color: #9ca3af;
      }
      .submit-button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        font-weight: 500;
        font-size: 0.875rem;
        cursor: pointer;
        transition: background-color 0.2s;
        width: 100%;
      }
      .submit-button:hover {
        background-color: #1d4ed8;
      }
      p.help-text {
        font-size: 0.75rem;
        color: #6b7280;
        margin-top: 0.5rem;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Program</h1>
      <form class="upload-form" action="#" method="post" enctype="multipart/form-data">
        <div>
          <div class="file-input-wrapper">
            <span class="file-input-button">Choose a .txt file...</span>
            <input type="file" name="programFile" accept=".txt" required />
          </div>
          <p class="help-text">Please upload sample_program.txt</p>
        </div>
        <button type="submit" class="submit-button">Upload File</button>
      </form>
    </div>
  </body>
</html>
