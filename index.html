<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload File</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      color: #111827;
      font-size: 24px;
    }
    p {
      color: #4b5563;
      margin-bottom: 24px;
      font-size: 16px;
    }
    input[type="file"] {
      display: none;
    }
    .upload-btn {
      background-color: #3b82f6;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      display: inline-block;
      transition: background-color 0.2s;
    }
    .upload-btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload Program</h1>
    <p>Select your sample_program.txt file to upload.</p>
    <label class="upload-btn">
      Upload File
      <input type="file" accept=".txt">
    </label>
  </div>
</body>
</html>
