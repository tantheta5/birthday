<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Program</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .upload-btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .upload-btn:hover {
      background-color: #0056b3;
    }
    input[type="file"] {
      display: block;
      margin: 1rem auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload Sample Program</h1>
    <form>
      <input type="file" name="file" accept=".txt" required>
      <button type="submit" class="upload-btn">Upload</button>
    </form>
  </div>
</body>
</html>
