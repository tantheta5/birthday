<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Program</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .upload-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    p {
      margin-bottom: 30px;
      color: #7f8c8d;
      font-size: 14px;
    }
    .file-input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    input[type="file"] {
      display: none;
    }
    .custom-file-upload {
      display: inline-block;
      padding: 12px 20px;
      cursor: pointer;
      background-color: #ecf0f1;
      color: #2c3e50;
      border-radius: 6px;
      border: 1px solid #bdc3c7;
      transition: background-color 0.3s, border-color 0.3s;
      font-size: 14px;
      font-weight: 500;
    }
    .custom-file-upload:hover {
      background-color: #e0e6ed;
      border-color: #95a5a6;
    }
    .upload-button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s, transform 0.1s;
      width: 100%;
    }
    .upload-button:hover {
      background-color: #2980b9;
    }
    .upload-button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <h1>Upload Program</h1>
    <p>Please select your <strong>sample_program.txt</strong> file to upload.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <div class="file-input-wrapper">
        <label for="file-upload" class="custom-file-upload">
          Choose File
        </label>
        <input id="file-upload" type="file" name="file" accept=".txt">
      </div>
      <button type="submit" class="upload-button">Upload</button>
    </form>
  </div>
</body>
</html>
