<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #222;
      }
      p {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .upload-section {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
      }
      input[type="file"] {
        border: 1px solid #ccc;
        padding: 0.5rem;
        border-radius: 4px;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.2s;
        width: 100%;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Program</h1>
      <p>Please select your <code>sample_program.txt</code> file to upload.</p>

      <form class="upload-section" action="#" method="post" enctype="multipart/form-data">
        <input type="file" name="sample_program" id="sample_program" accept=".txt">
        <button type="submit">Upload File</button>
      </form>
    </div>
  </body>
</html>
