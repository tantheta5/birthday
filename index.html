<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Program</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-wrapper {
            position: relative;
            display: inline-block;
        }

        .upload-button {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-block;
            font-weight: 500;
        }

        .upload-button:hover {
            background-color: #2563eb;
        }

        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload File</h1>
        <p>Please upload your sample_program.txt file.</p>
        <div class="upload-wrapper">
            <button class="upload-button">Select File</button>
            <input type="file" accept=".txt" name="sample_program" />
        </div>
    </div>
</body>
</html>
