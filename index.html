<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Sample Program</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #fff;
        padding: 2rem 3rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #2c3e50;
      }
      p {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .upload-btn-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .btn {
        border: 1px solid #3498db;
        color: white;
        background-color: #3498db;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s, border-color 0.3s;
      }
      .btn:hover {
        background-color: #2980b9;
        border-color: #2980b9;
      }
      .upload-btn-wrapper input[type=file] {
        font-size: 100px;
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Program</h1>
      <p>Please upload your sample_program.txt file.</p>
      <div class="upload-btn-wrapper">
        <button class="btn">Choose File</button>
        <input type="file" name="sample_program" accept=".txt" />
      </div>
    </div>
  </body>
</html>
