<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Sample Program</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #ffffff;
        padding: 2rem;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        text-align: center;
        max-width: 24rem;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 0.5rem;
      }
      p {
        color: #4b5563;
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }
      .file-input {
        display: block;
        width: 100%;
        margin-bottom: 1rem;
        color: #4b5563;
        font-size: 0.875rem;
      }
      .file-input::file-selector-button {
        background-color: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-right: 1rem;
      }
      .file-input::file-selector-button:hover {
        background-color: #e5e7eb;
      }
      .submit-btn {
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s;
      }
      .submit-btn:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Upload File</h1>
      <p>Please upload your sample_program.txt file.</p>
      <form action="#" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".txt" class="file-input" required />
        <button type="submit" class="submit-btn">Upload</button>
      </form>
    </div>
  </body>
</html>
