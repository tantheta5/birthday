<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple UI</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
        font-weight: 600;
        color: #222;
      }
      p {
        color: #666;
        margin-bottom: 24px;
      }
      .upload-btn-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .btn {
        border: none;
        color: white;
        background-color: #007bff;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btn:hover {
        background-color: #0056b3;
      }
      .upload-btn-wrapper input[type=file] {
        font-size: 100px;
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Project Upload</h1>
      <p>Please upload your sample_program.txt file</p>
      <div class="upload-btn-wrapper">
        <button class="btn">Upload File</button>
        <input type="file" name="myfile" accept=".txt" />
      </div>
    </div>
  </body>
</html>
