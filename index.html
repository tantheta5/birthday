<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Sample Program</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-color: #111827;
            --accent-color: #4f46e5;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --btn-hover: #4338ca;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .upload-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .upload-container h1 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .upload-container p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .file-input-wrapper {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .file-input-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.5rem;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            cursor: pointer;
            box-sizing: border-box;
        }

        input[type="file"]::file-selector-button {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            margin-right: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #e5e7eb;
        }

        .upload-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            box-sizing: border-box;
        }

        .upload-btn:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h1>Upload Program</h1>
        <p>Please upload your sample_program.txt file below.</p>

        <form action="#" method="post" enctype="multipart/form-data">
            <div class="file-input-wrapper">
                <label for="program_file" class="file-input-label">Select File</label>
                <input type="file" id="program_file" name="program_file" accept=".txt" required>
            </div>
            <button type="submit" class="upload-btn">Upload File</button>
        </form>
    </div>

</body>
</html>
