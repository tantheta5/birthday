<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Program</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #111;
      }
      p {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .upload-btn-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .btn {
        border: 2px solid #007bff;
        color: #fff;
        background-color: #007bff;
        padding: 8px 20px;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
      }
      .btn:hover {
        background-color: #0056b3;
        border-color: #0056b3;
      }
      .upload-btn-wrapper input[type=file] {
        font-size: 100px;
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Program</h1>
      <p>Please select your sample_program.txt file to upload.</p>

      <form>
        <div class="upload-btn-wrapper">
          <button class="btn">Upload File</button>
          <input type="file" name="sample_program" accept=".txt" />
        </div>
      </form>
    </div>
  </body>
</html>
