<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Program</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    p {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .file-input-wrapper {
      position: relative;
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 2rem;
      transition: border-color 0.2s ease;
      background-color: #f9fafb;
      cursor: pointer;
    }
    .file-input-wrapper:hover {
      border-color: #6366f1;
      background-color: #f3f4f6;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-input-label {
      font-size: 0.95rem;
      color: #4b5563;
      pointer-events: none;
    }
    .file-input-label span {
      color: #6366f1;
      font-weight: 500;
    }
    .submit-btn {
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      width: 100%;
    }
    .submit-btn:hover {
      background-color: #4f46e5;
    }
    .submit-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload Program</h1>
    <p>Please select your <strong>sample_program.txt</strong> file to upload.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <div class="file-input-wrapper">
        <div class="file-input-label">
          <span>Click to browse</span> or drag and drop<br>
          <small>TXT files only</small>
        </div>
        <input type="file" name="sample_program" accept=".txt" required>
      </div>
      <button type="submit" class="submit-btn">Upload File</button>
    </form>
  </div>
</body>
</html>
